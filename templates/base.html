<!DOCTYPE html>
{% load static %}
{% load meta %}
{% load crispy_forms_tags %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Ada Maduka | Bringing out the best in you </title>
    {% block meta_extend %}
    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">
    <meta name="description" content="Ada Maduka">

    {% endblock %}
    <link rel="shortcut icon" type="image/png" href="{% static 'snmov/img/wbicon.svg' %}"/>
    <link rel="stylesheet" href="{% static 'tinymce/css/prism.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'snmov/css/sm.css' %}">

</head>


<body class="d-flex flex-column bg-light min-vh-100 p-0">
    <header id="" class="mb-4">
        {% include 'navbar.html' %}
    </header>
    
    <div class="mx-auto">
        {% include 'toasts.html' %}
    </div>
    
    <main class="flex-grow-1">
        <div class="container" style="padding-bottom: 48px;">
            {% block content %}
            {% endblock %}
        </div>
    </main>
    
    <footer class="page-footer border border-dark mt-auto flex-shrink-0">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-12 text-center">
              <ul class="list-unstyled d-flex justify-content-center mb-3">
                <li class="footer-logo">
                  <a href="/">
                    <img src="{% static 'snmov/img/v3.svg' %}" alt="Logo" width="400" height="200">
                  </a>
                </li>
              </ul>
              <div class="footer-copyright">
                <p class="text-center mb-0">&copy; 2024 adamaduka</p>
              </div>
            </div>
          </div>
        </div>
    </footer>
    
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="{% static 'snmov/js/sm.js' %}"></script>
    <script src="{% static 'tinymce/js/prism.js' %}"></script>
</body>
