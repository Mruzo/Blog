{% extends 'base.html' %}


{% block content %}

<!--    {% url 'homepage' as my_view %}-->
<!--    {% if request.path == my_view %}-->

<main id="main-section" class="flex-grow-1 burger align-items-center text-center" style="overflow: hidden;">

<section class="row m-1 position-relative">
  <div id="slider-bg" class="col card mx-auto px-6 position-relative border border-dark">
      <div class='slider pb-4'>
          <input name="input-slider" id='input-slide-0' type="radio" class='input-slide input-slide-num' checked autocomplete="off">
          <input name="input-slider" id='input-slide-1' type="radio" class='input-slide input-slide-num' autocomplete="off">
          <input name="input-slider" id='input-slide-2' type="radio" class='input-slide input-slide-num' autocomplete="off">
          <ul>
            <li class='slide-0'></li>
            <li class='slide-1'></li>
            <li class='slide-2'></li>
          </ul>
          <div class='slide-description'>
            <label class='slide-0'>
              <h5 class="text-right">english</h5>
              <h1 class="text-slide">Good roads <br> beckon return</h1>
            </label>
            <label class='slide-1'>
              <h5 class="text-right">igbo</h5>
              <h1 class="text-slide">Uzo di mma, <br> a gba ya mgbe ozo</h1>
            </label>
            <label class='slide-2'>
              <h5 class="text-right">pidgin</h5>
              <h1 class="text-slide">If e sure, <br> you go run am again</h1>
            </label>
          </div>
          <div class='slider-arrow-prev'>
            <label class='slide-0' for='input-slide-2'>&#8249;</label> <!-- Left arrow for slide 0 -->
            <label class='slide-1' for='input-slide-0'>&#8249;</label> <!-- Left arrow for slide 1 -->
            <label class='slide-2' for='input-slide-1'>&#8249;</label> <!-- Left arrow for slide 2 -->
          </div>
          
          <div class='slider-arrow-next'>
            <label class='slide-0' for='input-slide-1'>&#8250;</label> <!-- Right arrow for slide 0 -->
            <label class='slide-1' for='input-slide-2'>&#8250;</label> <!-- Right arrow for slide 1 -->
            <label class='slide-2' for='input-slide-0'>&#8250;</label> <!-- Right arrow for slide 2 -->
          </div>        
          
          <div class='slider-dot'>
            <label class='slide-0' for='input-slide-0'></label>
            <label class='slide-1' for='input-slide-1'></label>
            <label class='slide-2' for='input-slide-2'></label>
          </div>        
        </div>
  </div>
</section>
</main>

<div class="container">
  <div class="row justify-content-center my-4">
    <div class="col-md-4 d-flex justify-content-between align-items-center">
      
      <div class="col-auto">
        <button onclick="loadContent('/about/', this)" class="neumorphic {% if request.resolver_match.url_name == 'about' %}active{% endif %}" style="font-size: 0.9rem; ">
          <span>PERSONA</span>
        </button>
      </div>

      <div class="col-auto">
        <button onclick="loadContent('/immersivecomics/', this)" class="neumorphic {% if request.resolver_match.url_name == 'comic_list' %}active{% endif %}" style="font-size: 0.9rem; ">
          <span>COMICS</span>
        </button>
      </div>
      
      <div class="col-auto">
        <button onclick="loadContent('/home-list/', this)" class="neumorphic {% if request.resolver_match.url_name == 'homelist' %}active{% endif %}" style="font-size: 0.9rem;">
          <span>REFLECTIONS</span>
        </button>
      </div>

      <div class="col-auto">
        <button onclick="loadContent('/crafts/', this)" class="neumorphic {% if request.resolver_match.url_name == 'craft' %}active{% endif %}" style="font-size: 0.9rem; ">
          <span>OTHER PROJECTS</span>
        </button>
      </div>

    </div>
  </div>
</div>

<!--    {% endif %}-->


<div id="content" class="container">
    
</div>



{% endblock %}
