<th scope="col">
    <span class="vybcheq-th-head d-inline-flex align-items-center gap-1">
        <span class="vybcheq-th-label">{{ label }}</span>
        <button
            type="button"
            class="vybcheq-th-info"
            data-bs-toggle="tooltip"
            data-bs-placement="top"
            data-bs-title="{{ tip }}"
            aria-label="About {{ label }}"
        >i</button>
    </span>
</th>
