<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - Justvybz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Quicksand', sans-serif;
        }
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
<div class="error-page container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <img src="/static/snmov/img/500.png" alt="500 Error" class="img-fluid mb-4" style="max-width: 300px;" onerror="this.style.display='none'">
            <h1 class="display-4 mb-4">Oops! Something Went Wrong</h1>
            <p class="lead mb-4">We're experiencing some technical difficulties. Please try again later.</p>
            <div class="error-actions">
                <a href="/" class="btn btn-primary btn-lg">
                    <i class="fas fa-home"></i> Back to Homepage
                </a>
            </div>
            <div class="mt-4">
                <p class="text-muted">
                    If this problem persists, please contact our support team at 
                    <a href="mailto:Justvybz@justvybz.com">Justvybz@justvybz.com</a>
                </p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
