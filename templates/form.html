{% extends "base.html" %}
{% load static %}

{% block content %}

{% load crispy_forms_tags %}


<div class="row">
    <div class="col-l8 mx-auto px-2 text-light">
        <div class="form-title text-center mt-5">
            {% if title %}
                <h2>
                    <p class="text-decoration-underline">{{ title }}</p>
                </h2>
            {% endif %}
        </div>
        <div id="feedback-message"></div> <!-- Element to display feedback messages -->
        <ul class="px-2">
            <form id="user-form" class="col-md-8 col-10 mx-auto" method='POST' action='.' enctype="multipart/form-data">
                <li class="list-group row">
                    {% csrf_token %}
                    {{ form|crispy }}
                </li>
                <li class="list-group row text-center">
                    <div class="col-3">
                        <button type="submit" class="center neumorphic" style="background: #FFBC00;">Send</button>
                    </div>
                </li>
            </form>
        </ul>
    </div>
</div>

  

{% endblock %}
