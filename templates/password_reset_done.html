{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row burger">
    <div class="col-lg-4 col-md-6 mx-auto mt-5">
        <!-- Card Layout for Consistency -->
        <div class="card left-align" style="margin:0 2%;">
            <!-- Centered Title -->
            <div class="card-title border-bottom text-center">
                <h4>Password Reset</h4>
            </div>

            <!-- Confirmation Message -->
            <div class="card-body">
                <p class="text-center">An email has been sent with instructions to reset your password.</p>
            </div>

            <!-- Back to Login Link -->
            <div class="card-footer text-center">
                <p class="b-text">
                    Remember your password? <a href="/login"><strong><u>Login here</u></strong></a>.
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
