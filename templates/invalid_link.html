{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card mt-5">
                <div class="card-body text-center">
                    <h2 class="card-title text-danger">Invalid Verification Link</h2>
                    <p class="card-text">{{ message|default:"The verification link you used is invalid or has expired." }}</p>
                    <p class="card-text">Please try registering again or contact support if you continue to have issues.</p>
                    <a href="{% url 'register' %}" class="btn btn-primary">Register Again</a>
                    <a href="{% url 'homepage' %}" class="btn btn-secondary">Go Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
