{% load static %}

<nav class="navbar navbar-expand-lg navbar-light border-bottom w-100" style="background-color: #ffbc00;">
    <div class="container-fluid px-0">
        <a class="navbar-brand" href="/">
            <img src="{% static 'snmov/img/jv_header 1.2.svg' %}" alt="" height="50">
        </a>
        
                        <div class="d-flex align-items-center">
                    {% if user.is_authenticated %}
                    <a href="{% url 'immersivecomics:user_dashboard' %}" class="btn btn-light btn-sm mx-2 px-2" id="profile-btn" onclick="switchToProfileNavbar(event)">
                        <i class="fas fa-user"></i>
                        <span class="d-none d-sm-inline ms-1">Profile</span>
                    </a>
                    {% else %}
                    <a href="{% url 'login_req' %}" class="btn btn-light btn-sm mx-2 px-2" id="login-btn">
                        <i class="fas fa-sign-in-alt"></i>
                        <span class="d-none d-sm-inline ms-1">Login</span>
                    </a>
                    {% endif %}
            <a href="{% url 'snmov:view_cart' %}" class="btn btn-light btn-sm px-2 ms-2 position-relative">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill {% if cart_count > 0 %}bg-success{% else %}bg-danger{% endif %}">
                    {{ cart_count }}
                </span>
            </a>
        </div>
    </div>
</nav>
<div class="border-bottom w-100">
  <div class="container-fluid px-0">
    <!-- Default navbar state -->
    <div id="default-navbar" class="navbar-state-default d-flex justify-content-center align-items-center py-2 navbar-buttons-container" style="flex-wrap: nowrap; width: 100%;">
      <a href="{% url 'homepage' %}" class="btn btn-light btn-sm px-3 subtext-btn-sm nav-btn {% if request.path == '/' %}active{% endif %}" style="{% if request.path == '/' %}background-color: rgba(255, 188, 0, 0.1) !important; border: 2px solid #FFBC00 !important;{% endif %} white-space: nowrap; margin: 0 4px;">
        <i class="fas fa-play me-1"></i><span> Stories</span>
      </a>
      <a href="{% url 'immersivecomics:comic_list' %}" class="btn btn-light btn-sm px-3 subtext-btn-sm nav-btn {% if 'immersivecomics' in request.path %}active{% endif %}" style="{% if 'immersivecomics' in request.path %}background-color: rgba(255, 188, 0, 0.1) !important; border: 2px solid #FFBC00 !important;{% endif %} white-space: nowrap; margin: 0 4px;">
        <i class="fas fa-clapperboard me-1"></i><span> Studio</span>
      </a>
      <a href="{% url 'snmov:product_list' %}" class="btn btn-light btn-sm px-3 subtext-btn-sm nav-btn {% if 'product' in request.path %}active{% endif %}" style="{% if 'product' in request.path %}background-color: rgba(255, 188, 0, 0.1) !important; border: 2px solid #FFBC00 !important;{% endif %} white-space: nowrap; margin: 0 4px;">
        <i class="fas fa-store me-1"></i><span> Store</span>
      </a>
    </div>
    
    <!-- Profile navbar state -->
    <div id="profile-navbar" class="navbar-state-profile d-flex justify-content-center align-items-center py-2 navbar-buttons-container" style="flex-wrap: nowrap; width: 100%;">
      <a href="{% url 'homepage' %}" class="btn btn-light btn-sm px-3 subtext-btn-sm nav-btn" style="white-space: nowrap; margin: 0 4px;" onclick="switchToDefaultNavbar(event)">
        <i class="fas fa-play me-1"></i><span>Stories</span>
      </a>
      <a href="{% url 'immersivecomics:user_dashboard' %}" class="btn btn-light btn-sm px-3 subtext-btn-sm nav-btn {% if 'immersivecomics' in request.path and 'my-orders' not in request.path %}active{% endif %}" style="{% if 'immersivecomics' in request.path and 'my-orders' not in request.path %}background-color: rgba(255, 188, 0, 0.1) !important; border: 2px solid #FFBC00 !important;{% endif %} white-space: nowrap; margin: 0 4px;">
        <i class="fas fa-user me-1"></i><span>My Stuff</span>
      </a>
      <a href="{% url 'snmov:my_orders' %}" class="btn btn-light btn-sm px-3 subtext-btn-sm nav-btn {% if 'my-orders' in request.path %}active{% endif %}" style="{% if 'my-orders' in request.path %}background-color: rgba(255, 188, 0, 0.1) !important; border: 2px solid #FFBC00 !important;{% endif %} white-space: nowrap; margin: 0 4px;">
        <i class="fas fa-receipt me-1"></i><span>My Orders</span>
      </a>
    </div>
  </div>
</div>
