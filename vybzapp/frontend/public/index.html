<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    
    <!-- Base Meta Tags (Server-renderable fallback) -->
    <title>JustVybz Studios</title>
    <meta name="description" content="Cultural Inspiration meets Practical Innovation" />
    <meta name="keywords" content="3D comics, interactive stories, immersive comics, 3D storytelling, interactive narratives" />
    
    <!-- Open Graph Meta Tags (Base) -->
    <meta property="og:title" content="JustVybz Studios" />
    <meta property="og:description" content="Cultural Inspiration meets Practical Innovation" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.justvybz.com" />
    <meta property="og:image" content="https://www.justvybz.com/logo-80x80.svg" />
    
    <!-- Twitter Card Meta Tags (Base) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@justvybz27070" />
    <meta name="twitter:title" content="JustVybz Studios" />
    <meta name="twitter:description" content="Cultural Inspiration meets Practical Innovation" />
    <meta name="twitter:image" content="https://www.justvybz.com/logo-80x80.svg" />
    <meta name="twitter:image:alt" content="JustVybz Studios" />
    
    <!-- Theme and Security -->
    <meta name="theme-color" content="#ffbc00" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    
    <!-- Icons -->
    <link rel="icon" href="%PUBLIC_URL%/logo-80x80.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo-80x80.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="canonical" href="https://www.justvybz.com" />
    
    <!-- Critical CSS + Bootstrap load before React (reduces FOUC on / and /studios/) -->
    <link rel="preload" href="%PUBLIC_URL%/fonts/Varela-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="%PUBLIC_URL%/fonts/Quicksand.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="%PUBLIC_URL%/fonts/gillsansmt.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
    <link rel="stylesheet" href="%PUBLIC_URL%/critical.css" />
    
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" as="style" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    
    <!-- Material Symbols Outlined -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <!-- Model Viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <!-- Custom CSS will be loaded by React -->
    
    <!-- React Helmet will dynamically update meta tags above -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    
    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
  </body>
</html>
