{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block head_title %}Edit Audio Track{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h2 class="mb-0">Edit Audio Track</h2>
    <a class="btn btn-outline-secondary" href="{% url 'immersivecomics:audio_track_list' %}">Back to Audio</a>
  </div>

  <div class="card">
    <div class="card-body">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">Save</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
