{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="container-fluid px-0">
    <!-- Modern Comic Header -->
    <div class="comic-header" style="background: linear-gradient(to right, #1a1a1a, #2a2a2a); color: white; padding: 2rem 0; margin-bottom: 2rem;">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <div class="episode-meta" style="margin-bottom: 1rem;">
                        <span class="season-badge" style="background: #ff4d4d; color: white; padding: 0.5rem 1rem; border-radius: 4px; font-weight: bold; margin-right: 1rem;">
                            Season {{ episode.season.season_number }}
                        </span>
                        <span class="episode-badge" style="background: #4d4dff; color: white; padding: 0.5rem 1rem; border-radius: 4px; font-weight: bold;">
                            Episode {{ episode.episode_number }}
                        </span>
                    </div>
                    <h1 class="episode-title" style="font-size: 2.5rem; font-weight: 800; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 1px;">
                        {{ episode.title }}
                    </h1>
                    <p class="episode-description" style="font-size: 1.1rem; opacity: 0.9; max-width: 800px;">
                        {{ episode.description }}
                    </p>
                </div>
                <div class="col-md-4 text-end">
                    <a href="{% url 'season_list' %}" class="back-button" style="color: white; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem;">
                        <i class="fas fa-arrow-left"></i>
                        Back to Titles
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- 3D Model Container -->
    <div class="container">
        <div class="card model-container mb-4 position-relative" style="height: 400px; border: none; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
            <model-viewer
                id="model-viewer"
                src="{{ model_gltf }}"
                alt="3D Scene"
                style="width: 100%; height: 100%;"
                shadow-intensity="1"
                exposure="1"
                interaction-prompt="none"
                interpolation-decay="200"
                interpolation="cubic-bezier(0.3, 0.0, 0.7, 1.0)"
                min-camera-orbit="auto auto 1m"
                max-camera-orbit="auto auto 30m"
                min-field-of-view="10deg"
                max-field-of-view="90deg"
                autoplay
                preload
                loading="eager"
                camera-controls>
                
                <!-- Overlay Image with Start Button -->
                <div id="overlay-container" class="overlay-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; z-index: 2;">
                    <img src="{{ episode.cover_image.url }}" alt="Episode Cover" style="width: 100%; height: 100%; object-fit: cover;">
                    <button id="start-button" class="btn btn-primary" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3; padding: 1rem 2rem; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; background: #ff4d4d; border: none; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);">
                        Start Episode
                    </button>
                </div>

                <!-- Fixed Top Bubble -->
                <div id="top-bubble" class="speech-bubble position-absolute top-0 start-50 translate-middle-x bg-light p-1 rounded border border-dark" style="z-index: 1;">
                    <div id="top-dialogue">Loading dialogue...</div>
                </div>

                <!-- SVG for Pointer Line -->
                <svg id="pointer-svg" style="display: none;">
                    <path id="pointer-path" stroke="white" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
                </svg>

                <!-- Hotspots will be dynamically created from POV data -->

                <!-- Styles for Hotspots -->
                <style>
                    /* Hotspot styles */
                    .hotspot {
                        background: none;
                        border: none;
                        cursor: pointer;
                        display: block;
                        height: 20px;
                        width: 20px;
                        padding: 0;
                        position: absolute;
                        transform: translate(-50%, -50%);
                        transition: opacity 0.3s;
                    }

                    .hotspot[data-visible="false"] {
                        opacity: 0;
                    }

                    .hotspot .dot {
                        width: 20px;
                        height: 20px;
                        border-radius: 50%;
                        border: 2px solid white;
                        box-shadow: 0 0 4px rgba(0,0,0,0.5);
                        transition: transform 0.3s;
                    }

                    .hotspot:hover .dot {
                        transform: scale(1.2);
                    }

                    .hotspot .dot.red { background-color: #ff0000; }
                    .hotspot .dot.blue { background-color: #0000ff; }
                    .hotspot .dot.green { background-color: #00ff00; }
                    .hotspot .dot.yellow { background-color: #ffff00; }

                    /* Pointer line styling */
                    #pointer-svg {
                        position: absolute;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        pointer-events: none;
                        z-index: 9999;
                    }

                    #pointer-path {
                        stroke-width: 2;
                        stroke-dasharray: 5,5;
                        fill: none;
                    }

                    /* Speech bubble styling */
                    .speech-bubble {
                        position: fixed;
                        top: 20px;
                        left: 50%;
                        transform: translateX(-50%);
                        background: white;
                        padding: 8px 12px;
                        border-radius: 8px;
                        max-width: 80%;
                        z-index: 100;
                    }
                </style>
            </model-viewer>
        </div>

        <!-- Navigation Buttons -->
        <div class="text-center mt-4 mb-4">
            <button id="prevButton" class="btn btn-primary me-2" disabled style="padding: 0.75rem 1.5rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; background: #4d4dff; border: none; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
                Previous
            </button>
            <button id="nextButton" class="btn btn-primary" style="padding: 0.75rem 1.5rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; background: #4d4dff; border: none; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
                Next
            </button>
        </div>
    </div>

    <!-- Dialogues Container -->
    <div class="dialogues-container" style="display: none;">
        {% for dialogue in dialogues_data %}
            <div class="dialogue" data-pov='{
                "character": "{{dialogue.character}}",
                "camera_orbit": "{{ dialogue.camera_orbit|escapejs }}",
                "camera_target": "{{ dialogue.camera_target|escapejs }}",
                "field_of_view": "{{ dialogue.field_of_view|escapejs }}",
                "zoom_speed": "{{ dialogue.zoom_speed|escapejs }}",
                "rotation": "{{ dialogue.rotation|escapejs }}",
                "head_x": {{ dialogue.head_x|default:"0" }},
                "head_y": {{ dialogue.head_y|default:"0" }},
                "head_z": {{ dialogue.head_z|default:"0" }},
                "text": "{{ dialogue.text|escapejs }}"
            }'></div>
        {% endfor %}
    </div>
</div>

<style>
    /* Custom CSS for speech bubbles */
    .speech-bubble {
        width: 100%;
        max-width: none;
        text-align: left;
        z-index: 10;
        font-family: 'Comic';
        font-size: small;
    }

    .pointer {
        pointer-events: none;
    }

    /* Modern Comic Styles */
    .comic-header {
        position: relative;
        overflow: hidden;
    }

    .comic-header::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(to right, #ff4d4d, #4d4dff);
    }

    .episode-title {
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .back-button:hover {
        color: #ff4d4d;
        transition: color 0.3s ease;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 8px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
    }

    .btn-primary:disabled {
        opacity: 0.5;
        transform: none;
        box-shadow: none;
    }
</style>

{% endblock %}
